name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Integration tests snapshot the public hazcod/enpass-cli test vault
      # with the real binary (MASTERPW=absolutely-No-clue). Never a real vault.
      - run: brew install enpass-cli

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
